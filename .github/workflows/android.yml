name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK Platform
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(printenv ANDROID_SDK_ROOT || printenv ANDROID_HOME || echo /usr/local/lib/android/sdk)"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$MANAGER"
          echo "Using SDK manager: $MANAGER"
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore development signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: autopilot-dev-signing-v1
      - name: Initialize development signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=AutoPilot Dev,O=AutoPilot,C=US"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check project structure
        run: python3 tools/validate_project.py
      - name: Validate LSPosed observer integration
        run: python3 tools/validate_meijer_trace.py
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug :meijerprobe:assembleDebug
      - name: Upload independent Meijer probe APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoPilot-Meijer-Probe
          path: meijerprobe/build/outputs/apk/debug/meijerprobe-debug.apk
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoPilot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
