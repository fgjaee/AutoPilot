name: Android APK
concurrency:
  group: autopilot-debug-signing
  cancel-in-progress: false
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK Platform
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(printenv ANDROID_SDK_ROOT || printenv ANDROID_HOME || echo /usr/local/lib/android/sdk)"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$MANAGER"
          echo "Using SDK manager: $MANAGER"
          yes | "$MANAGER" --licenses >/dev/null || true
          "$MANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore known development signing key
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: autopilot-dev-signing-v1
      - name: Enforce signing-key continuity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.cache-hit }}" != "true" || ! -s "$HOME/.android/debug.keystore" ]]; then
            echo "::error::Known debug signer missing: refusing to create a mismatched update."
            exit 1
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "Existing development signer restored."
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check project structure
        run: python3 tools/validate_project.py
      - name: Validate LSPosed observer integration
        run: python3 tools/validate_meijer_trace.py
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Confirm APK matches cached signing certificate
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$HOME/.android/debug.keystore"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          EXPECTED="$(keytool -list -v -keystore "$KEYSTORE" -alias androiddebugkey -storepass android | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$EXPECTED"
          test "$EXPECTED" = "$ACTUAL" || {
            echo "::error::APK certificate does not match cached development signer."
            exit 1
          }
          echo "Verified APK signing certificate SHA256: $ACTUAL"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoPilot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
