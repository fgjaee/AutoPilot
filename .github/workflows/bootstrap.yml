name: Import AutoPilot source and build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand native source
        run: |
          set -euo pipefail
          tar -xJf bootstrap/source.tar.xz
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit source tree to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import AutoPilot Native v0.3 source [skip ci]'
            git push origin HEAD:main || echo '::warning::Unable to push expanded source automatically'
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check project source
        run: |
          python3 tools/validate_project.py
          python3 tools/validate_meijer_trace.py
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AutoPilot-Native-v0.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
